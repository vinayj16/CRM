<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ultrakey">
  <defs>
    <style>
      .uk-blue { fill: #1F75CB; }
      .uk-gold { fill: #D4AF37; }
    </style>
  </defs>

  <!-- Rounded tile background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#162436" />

  <g transform="translate(6,4) scale(0.82)">
    <!-- Shackle (blue arch) -->
    <path class="uk-blue" d="M 52 96 L 52 62 C 52 32 72 12 104 12 C 136 12 156 32 156 62 L 156 96 L 142 96 L 142 62 C 142 40 127 26 104 26 C 81 26 66 40 66 62 L 66 96 Z" />

    <!-- Circular body ring: blue left half, gold right half -->
    <path class="uk-blue" d="M 104 40 A 56 56 0 0 0 48 96 A 56 56 0 0 0 104 152 L 104 40 Z" />
    <path class="uk-gold" d="M 104 40 A 56 56 0 0 1 160 96 A 56 56 0 0 1 104 152 L 104 40 Z" />

    <!-- Stylized K -->
    <path class="uk-gold" d="M 118 68 L 118 124 L 108 124 L 108 96 L 92 118 L 92 106 L 106 86 L 92 68 L 92 56 L 106 74 L 118 68 Z" />
    <path class="uk-blue" d="M 118 68 L 118 74 L 108 74 L 118 68 Z" />

    <!-- Circuit nodes -->
    <circle class="uk-gold" cx="158" cy="58" r="5" />
    <path d="M 154 62 L 146 70" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle class="uk-gold" cx="140" cy="80" r="4" />
    <circle class="uk-blue" cx="150" cy="118" r="5" />
    <path d="M 146 114 L 138 106" stroke="#1F75CB" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle class="uk-blue" cx="132" cy="100" r="4" />
  </g>
</svg>
