<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Ultrakey PropTech">
  <defs>
    <style>
      .uk-blue { fill: #1F75CB; }
      .uk-gold { fill: #D4AF37; }
      .uk-text-blue { fill: #1F75CB; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .uk-text-gold { fill: #D4AF37; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 6px; }
    </style>
  </defs>

  <!-- ===== Padlock-K icon mark ===== -->
  <g>
    <!-- Shackle (blue arch) -->
    <path class="uk-blue" d="M 52 96 L 52 62 C 52 32 72 12 104 12 C 136 12 156 32 156 62 L 156 96 L 142 96 L 142 62 C 142 40 127 26 104 26 C 81 26 66 40 66 62 L 66 96 Z" />

    <!-- Circular body ring: blue left half, gold right half -->
    <path class="uk-blue" d="M 104 40 A 56 56 0 0 0 48 96 A 56 56 0 0 0 104 152 L 104 40 Z" />
    <path class="uk-gold" d="M 104 40 A 56 56 0 0 1 160 96 A 56 56 0 0 1 104 152 L 104 40 Z" />

    <!-- Stylized K (gold arms on blue stem) -->
    <path class="uk-gold" d="M 118 68 L 118 124 L 108 124 L 108 96 L 92 118 L 92 106 L 106 86 L 92 68 L 92 56 L 106 74 L 118 68 Z" />
    <path class="uk-blue" d="M 118 68 L 118 74 L 108 74 L 118 68 Z" />

    <!-- Circuit nodes -->
    <circle class="uk-gold" cx="158" cy="58" r="5" />
    <path class="uk-gold" d="M 154 62 L 146 70" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle class="uk-gold" cx="140" cy="80" r="4" />
    <circle class="uk-blue" cx="150" cy="118" r="5" />
    <path class="uk-blue" d="M 146 114 L 138 106" stroke="#1F75CB" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle class="uk-blue" cx="132" cy="100" r="4" />
  </g>

  <!-- ===== House skyline motif (gold outline above the wordmark) ===== -->
  <g fill="none" stroke="#D4AF37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 232 62 L 232 46 L 248 46 L 248 62" />
    <path d="M 226 58 L 240 42 L 254 58" />
    <rect x="238" y="50" width="4" height="4" />
    <rect x="244" y="50" width="4" height="4" />
    <path d="M 258 62 L 258 50 L 272 50 L 272 62" />
    <path d="M 254 58 L 265 44 L 276 58" />
    <path d="M 284 62 L 284 52 L 292 52 L 292 62" />
    <path d="M 280 60 L 288 48 L 296 60" />
  </g>

  <!-- ===== Wordmark ===== -->
  <text class="uk-text-blue" x="228" y="112" font-size="64">Ultrakey</text>
  <text class="uk-text-gold" x="230" y="150" font-size="26">PropTech</text>
</svg>
